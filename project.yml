# Backup: regenerate the Xcode project with XcodeGen (brew install xcodegen && xcodegen)
name: Blow
options:
  bundleIdPrefix: app.blow
  deploymentTarget:
    iOS: "17.0"
targets:
  Blow:
    type: application
    platform: iOS
    sources: [Blow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blow.Blow
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Blow
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Blow listens for your breath so you can blow out the candles. Nothing is recorded.
        INFOPLIST_KEY_NSMotionUsageDescription: Blow uses motion so the candle flames sway as you move the phone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
